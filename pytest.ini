[pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-config --strict-markers
norecursedirs = .git .venv basemodels dataset exports logs reports runs
markers =
    training: executes a real model-training workload (excluded from baseline CI)
    gpu: requires a CUDA-capable GPU (excluded from baseline CI)
