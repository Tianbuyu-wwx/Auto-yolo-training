name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-baseline:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
      YOLO_CONFIG_DIR: ${{ github.workspace }}/.ci/ultralytics

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 用 3.12 而不是 3.12.13 —— 后者在 Windows 2025 runner 上不可用
          # actions/setup-python 会自动选最新 3.12.x patch 版本
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Install CPU PyTorch
        run: >-
          python -m pip install
          torch==2.11.0 torchvision==0.26.0
          --index-url https://download.pytorch.org/whl/cpu

      - name: Install application and test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verify dependency graph
        run: python -m pip check

      - name: Check Python source
        run: python -m ruff check .

      - name: Run CPU-safe tests
        run: python -m pytest -m "not gpu and not training"
