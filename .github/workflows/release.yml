name: release

# 发版：打 `v*` 标签触发。构建（含前端装填）→ 校验 → 发布。
#
# 发布走 **Trusted Publishing**（OIDC），不需要在仓库里存 PyPI API token。
# 首次发布前需要一次性配置：
#   PyPI  → Account settings → Publishing → Add a pending publisher
#           Owner=Tianbuyu-wwx  Repository=Auto-yolo-training
#           Workflow=release.yml  Environment=release
#   TestPyPI 同理（`rc` 标签会发到这里）。
# 详细步骤见 docs/publishing.md。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Stage frontend assets into the package
        run: python scripts/stage_frontend_assets.py

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      # 打包最容易出的错是「wheel 里没有界面」——装出来首页只有 JSON 提示。
      # 这条断言比 twine check 更贴近产品形态，所以单独钉一条。
      - name: Assert the wheel ships the console UI
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = ["src/api/static/index.html"]
          missing = [n for n in required if n not in names]
          if missing:
              raise SystemExit(f"{wheel} 缺少界面文件: {missing}")
          print(f"{wheel}: 含 index.html 与 {sum(1 for n in names if n.startswith('src/api/static/'))} 个静态文件")
          PY

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # environment 是 Trusted Publisher 的一部分（PyPI 侧登记的就是这个名字），
    # 顺便可以在 GitHub 上挂人工批准。
    environment: release
    permissions:
      id-token: write        # OIDC：Trusted Publishing 用它换一次性上传凭据
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # `v*-rc*` 走 TestPyPI：先在预发布环境把整条链路跑通，再发正式版。
      - name: Publish to TestPyPI (rc tags)
        if: contains(github.ref_name, 'rc')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: ${{ !contains(github.ref_name, 'rc') }}
        uses: pypa/gh-action-pypi-publish@release/v1
