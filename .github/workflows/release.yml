name: release

# 发版：打 `v*` 标签触发。构建（含前端装填）→ 校验 → 发布。
#
# 发布走 **Trusted Publishing**（OIDC），不需要在仓库里存 PyPI API token。
# 首次发布前需要一次性配置：
#   PyPI  → Account settings → Publishing → Add a pending publisher
#           Owner=Tianbuyu-wwx  Repository=Auto-yolo-training
#           Workflow=release.yml  Environment=release
#   TestPyPI 同理（`rc` 标签会发到这里）。
# 详细步骤见 docs/publishing.md。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Vue 网页端已退役（桌面启动器是唯一前端）：静态快照 src/api/static/
      # 随仓库维护，快照已存在时这步是 no-op——保留它是轮子完整性的记录点。
      - name: Stage static assets into the package
        run: python scripts/stage_frontend_assets.py

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      # 打包最容易出的错是「wheel 里没有界面」——装出来首页只有 JSON 提示。
      # 这条断言比 twine check 更贴近产品形态，所以单独钉一条。
      - name: Assert the wheel ships the console UI
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = ["src/api/static/index.html"]
          missing = [n for n in required if n not in names]
          if missing:
              raise SystemExit(f"{wheel} 缺少界面文件: {missing}")
          print(f"{wheel}: 含 index.html 与 {sum(1 for n in names if n.startswith('src/api/static/'))} 个静态文件")
          PY

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  launcher-exe:
    # 单文件桌面启动器 AYT.exe：Windows runner 构建，随 Release 分发。
    # 双击即打开启动器（训练/推理子进程用本机 Python 跑项目代码，不进 exe）。
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write        # softprops/action-gh-release 需要写 Release
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 打包环境只需「主进程 import 链」的依赖：PyInstaller 靠 import 分析
      # 决定打进什么；torch/ultralytics 属于子进程侧，不装也不会进包。
      - name: Install build tools
        run: >-
          python -m pip install --upgrade pyinstaller fastapi "uvicorn[standard]"
          pydantic pydantic-settings pywebview numpy opencv-python

      - name: Build AYT.exe
        run: python scripts/build_launcher.py --clean

      - name: Verify the exe was produced
        run: |
          python -c "import pathlib; p=pathlib.Path('dist/launcher/AYT.exe'); assert p.is_file(), p; print('AYT.exe', round(p.stat().st_size/1e6, 1), 'MB')"

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: AYT-Launcher
          path: dist/launcher/AYT.exe

      - name: Attach launcher to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/launcher/AYT.exe

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # environment 是 Trusted Publisher 的一部分（PyPI 侧登记的就是这个名字），
    # 顺便可以在 GitHub 上挂人工批准。
    environment: release
    permissions:
      id-token: write        # OIDC：Trusted Publishing 用它换一次性上传凭据
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # `v*-rc*` 走 TestPyPI：先在预发布环境把整条链路跑通，再发正式版。
      - name: Publish to TestPyPI (rc tags)
        if: contains(github.ref_name, 'rc')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: ${{ !contains(github.ref_name, 'rc') }}
        uses: pypa/gh-action-pypi-publish@release/v1
