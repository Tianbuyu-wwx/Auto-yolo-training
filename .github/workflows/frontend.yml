name: frontend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 版本与 frontend/package.json 的 packageManager 保持一致，
      # 否则 pnpm 会因 lockfileVersion 或 workspace 配置差异拒绝 --frozen-lockfile
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # 组件测试（Vitest + jsdom）。顺序放在构建之前：逻辑坏了就没必要再等构建。
      # 覆盖三块：REST/WS 封装的边界、组件判定逻辑、以及「后端空数据时 7 个页面
      # 都能挂载」的整页冒烟 —— 后者是前端唯一能自动发现整页白屏的手段。
      - name: Test
        working-directory: frontend
        run: pnpm test

      - name: Build
        working-directory: frontend
        run: pnpm build

      # 防量级退化。此前整包 echarts 被静态引入（占产物 88.5%），
      # 而项目只画一张折线图 —— 这类问题肉眼 review 不出来，只能靠门禁。
      - name: Check bundle budget
        working-directory: frontend
        run: pnpm check-bundle
