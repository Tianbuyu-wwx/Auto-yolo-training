[build-system]
requires = ["setuptools>=77"]   # SPDX license 表达式需要 >=77
build-backend = "setuptools.build_meta"

[project]
name = "auto-yolo-training"
version = "0.1.0"
description = "通用 YOLO 模型自动训练平台：数据校验、训练、评估、导出、推理一体化"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
keywords = ["yolo", "ultralytics", "object-detection", "training", "mlops"]
authors = [
    {name = "Auto YOLO Training Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python",
]

# 直接依赖（与 requirements.txt 一致；PyTorch 单独通过 extras 安装）
dependencies = [
    "ultralytics>=8.4.0",
    "optuna>=4.0",
    "fastapi>=0.139",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "opencv-python>=4.10",
    "numpy>=2.0",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
# PyTorch 必须单独安装（CUDA/CPU wheel 来源不同）
# pip install 'auto-yolo-training[gpu-cu128]'
gpu-cu128 = ["torch>=2.11", "torchvision>=0.26"]
gpu-cu118 = ["torch>=2.11", "torchvision>=0.26"]
cpu = ["torch>=2.11", "torchvision>=0.26"]
# 导出 ONNX/TensorRT 时附加依赖
onnx = ["onnx>=1.15", "onnxsim>=0.4"]
tensorrt = ["tensorrt>=10.0"]
# 已冻结的 Gradio 界面（历史入口）。默认**不安装**：
#   pip install 'auto-yolo-training[gradio]'
# 控制台（ayt-web）与训练/推理链路都不依赖它；未安装时 `ayt-gradio`
# 会打印可操作的报错而不是 ImportError 堆栈。
gradio = ["gradio>=5.0"]
# 桌面启动器（Phase 1+）：pywebview 壳 + 内嵌管理面后端。
# 默认不安装：pip install 'auto-yolo-training[launcher]'
# （Windows 走 WebView2；训练/控制台链路不依赖它，只有 ayt-launcher 需要。）
launcher = ["pywebview>=6.2"]
# 开发与测试。含 gradio：测试会导入 UI 模块（test_phase1 / test_phase3）
dev = [
    "gradio>=5.0",
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "httpx>=0.28",
    "ruff>=0.14",
    "pre-commit>=3.0",
    "mypy>=1.10",
    # 打包与发布（make dist / release workflow）
    "build>=1.2",
    "twine>=5.0",
]
# 文档构建（阶段 B 末）
docs = ["mkdocs>=1.5", "mkdocs-material>=9"]

[project.urls]
Homepage = "https://github.com/Tianbuyu-wwx/Auto-yolo-training"
Repository = "https://github.com/Tianbuyu-wwx/Auto-yolo-training"
Issues = "https://github.com/Tianbuyu-wwx/Auto-yolo-training/issues"
Documentation = "https://tianbuyu-wwx.github.io/Auto-yolo-training/"

# ----------------------------------------------------------------------
# 包布局（显式声明，覆盖 setuptools 的自动探测）
#
# CLI 入口已内迁到 src/cli/（见 [project.scripts]），随 src* 包一起分发，
# 不再需要顶层 py-modules。
# ----------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# 前端产物装进包内（src/api/static/），由 scripts/stage_frontend_assets.py 在打包前
# 装填。否则 pip 装出来的只有 API，控制台首页是个 JSON 提示 —— 而这个工具的产品
# 形态就是「控制台 + API」。
[tool.setuptools.package-data]
"src.api" = ["static/*", "static/**/*"]
# 启动器 UI 是手写静态文件（无构建步骤），直接随包分发。
"src.launcher" = ["static/*", "static/**/*"]

[project.scripts]
# 阶段 B3：安装后系统 PATH 可直接调用（实现位于 src/cli/）
ayt-train = "src.cli.train:main"
ayt-tune = "src.cli.tune:main"
ayt-eval = "src.cli.eval:main"
ayt-export = "src.cli.export:main"
ayt-serve = "src.cli.serve:main"
ayt-validate = "src.cli.validate_data:main"
ayt-gradio = "src.cli.gradio_app:main"
ayt-models = "src.cli.ayt_models:main"  # 阶段 C5：预训练模型清单与下载
# 管理面 Web（FastAPI + Vue SPA）。src/api/admin.py 的 CLI 文档字符串一直宣称
# 存在该入口，但此前从未注册，导致 pip install -e . 后 ayt-web 不可用。
ayt-web = "src.api.admin:main"
# 桌面启动器：内嵌管理面后端 + pywebview 窗口（需要 [launcher] extra）
ayt-launcher = "src.launcher.app:main"

[project.gui-scripts]
# Windows 菜单项；不影响 Unix
ayt-gradio-gui = "src.cli.gradio_app:main"

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-ra --strict-config --strict-markers"
norecursedirs = [".git", ".venv", "basemodels", "dataset", "artifacts"]
markers = [
    "training: executes a real model-training workload (excluded from baseline CI)",
    "gpu: requires a CUDA-capable GPU (excluded from baseline CI)",
]

[tool.coverage.run]
# 只统计产品代码；test/ 不计入（否则覆盖率会随测试写法波动）
source = ["src"]

[tool.coverage.report]
# 这些行不算「未覆盖」：类型检查分支、抽象方法、入口守卫 —— 它们要么只在特定
# 解释器下执行，要么本就是协议占位。故意保持极短：排除越多，门禁越没意义。
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "basemodels",
    "dataset",
    "exports",
    "logs",
    "reports",
    "runs",
]

[tool.ruff.lint]
# 阶段 B4：启用全量规则集（基础 + 导入 + 现代化 + 错误捕获 + 简化）
# E/W = pycodestyle, F = Pyflakes, I = isort, UP = pyupgrade, B = bugbear, C4 = comprehensions
# SIM = simplify
# 忽略：E501（行长——项目已有 100 字符限制）、B008（fastapi Depends 参数常见）
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # 行长限制（pyproject.toml line-length=100 仍生效，但允许略超）
    "B008",  # fastapi/pydantic 函数调用 in 默认值：项目里非常常见
    "SIM108",  # 三元表达式 vs if/else：风格偏好，不强求
    "SIM117",  # 嵌套 with 语句：某些场景嵌套更清晰
    "SIM112",  # SystemRoot / CASE 敏感环境变量名（Windows 官方就是 SystemRoot）
]
# 允许 fix 模式自动修复安全项
fixable = ["ALL"]
unfixable = [
    "F841",  # 未使用变量：避免误删（局部变量）
]

[tool.ruff.lint.per-file-ignores]
# 测试文件允许未使用方法（fixture 等）
"test/*" = ["F401", "F811", "B011", "E402"]
# run_tests.py 的 sys.path hack 故意在 import 后
"test/run_tests.py" = ["E402"]
# __init__.py 允许未使用 import（re-export）
"src/__init__.py" = ["F401", "SIM112"]
"src/gradio_app/__init__.py" = ["F401"]
"src/gradio_app/components/__init__.py" = ["F401"]
"src/gradio_app/models/__init__.py" = ["F401"]
"src/gradio_app/services/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true