<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>夜樱 · 场景原型</title>
<style>
  html,body{ margin:0; height:100%; overflow:hidden; background:#060a14; }
  #stage{ position:fixed; inset:0; }
  /* 夜空底（CSS 渐变，WebGL 透明叠加） */
  .sky{ position:fixed; inset:0;
    background:
      radial-gradient(56% 46% at 22% 18%, rgba(168,196,255,.20) 0%, rgba(168,196,255,0) 66%),
      radial-gradient(70% 60% at 78% 88%, rgba(80,110,190,.14) 0%, rgba(80,110,190,0) 70%),
      radial-gradient(120% 130% at 50% 46%, rgba(2,6,14,0) 40%, rgba(2,6,14,.42) 78%, rgba(2,6,14,.66) 100%),
      linear-gradient(180deg, #0a1226 0%, #08101f 46%, #060b17 100%);
  }
  .vign{ position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(126% 150% at 50% 44%, rgba(2,6,14,0) 42%, rgba(2,6,14,.36) 80%, rgba(2,6,14,.6) 100%); }
</style>
</head>
<body>
<div class="sky"></div>
<div id="stage"></div>
<div class="vign"></div>

<script src="lib/three.min.js"></script>
<script>
'use strict';
/* ============================================================
   夜樱 · Living world 场景原型（全程序化 · 无外部资产）
   构图：双主枝斜贯画面 · 花簇沿枝 · 花瓣雨 · 萤光 · 月晕 · 鼠标视差
   ============================================================ */
(function(){
  var stage = document.getElementById('stage');
  var W = innerWidth, H = innerHeight;

  var renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  renderer.setSize(W, H);
  renderer.setClearColor(0x000000, 0);
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x081020, 0.030);

  var camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 120);
  camera.position.set(0, 0, 10.5);

  var world = new THREE.Group();
  scene.add(world);

  /* ---------- 花瓣贴图（canvas 生成） ---------- */
  function petalTexture(){
    var c = document.createElement('canvas'); c.width = c.height = 64;
    var g = c.getContext('2d');
    // 花瓣形状：椭圆 + 顶端小缺
    g.translate(32, 34);
    g.beginPath();
    g.moveTo(0, 22);
    g.bezierCurveTo(-26, 14, -22, -16, 0, -24);
    g.bezierCurveTo(22, -16, 26, 14, 0, 22);
    g.closePath();
    var grad = g.createRadialGradient(-4, -6, 2, 0, 0, 26);
    grad.addColorStop(0, 'rgba(255,241,247,1)');
    grad.addColorStop(0.45, 'rgba(250,205,224,1)');
    grad.addColorStop(0.85, 'rgba(238,160,196,.92)');
    grad.addColorStop(1, 'rgba(238,160,196,0)');
    g.fillStyle = grad;
    g.shadowColor = 'rgba(255,220,235,.9)';
    g.shadowBlur = 5;
    g.fill();
    // 顶端缺
    g.globalCompositeOperation = 'destination-out';
    g.beginPath(); g.moveTo(-4, -26); g.lineTo(0, -19); g.lineTo(4, -26); g.closePath(); g.fill();
    var t = new THREE.CanvasTexture(c);
    t.minFilter = THREE.LinearFilter;
    return t;
  }
  var PETAL = petalTexture();

  /* ---------- 光斑贴图（萤光/月晕） ---------- */
  function glowTexture(inner, outer){
    var c = document.createElement('canvas'); c.width = c.height = 64;
    var g = c.getContext('2d');
    var grad = g.createRadialGradient(32, 32, 1, 32, 32, 31);
    grad.addColorStop(0, inner);
    grad.addColorStop(0.4, outer);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
    var t = new THREE.CanvasTexture(c);
    t.minFilter = THREE.LinearFilter;
    return t;
  }
  var GLOW = glowTexture('rgba(255,244,225,1)', 'rgba(255,214,160,.35)');
  var MOON = glowTexture('rgba(226,238,255,.95)', 'rgba(168,196,255,.22)');

  /* ---------- 樱枝（CatmullRom + 分段 Tube，全程序化） ---------- */
  var barkMat = new THREE.MeshBasicMaterial({ color:0x14121a });
  function branch(points, r0, r1, seg){
    var v3 = points.map(function(p){ return new THREE.Vector3(p[0], p[1], p[2]); });
    var curve = new THREE.CatmullRomCurve3(v3, false, 'centripetal', 0.5);
    seg = seg || 5;
    for (var i = 0; i < seg; i++){
      var t0 = i / seg, t1 = (i + 1) / seg;
      var pts = [];
      for (var k = 0; k <= 8; k++){
        pts.push(curve.getPoint(t0 + (t1 - t0) * (k / 8)));
      }
      var sub = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.5);
      var r = r0 + (r1 - r0) * ((t0 + t1) / 2);
      var g = new THREE.TubeGeometry(sub, 10, Math.max(0.012, r), 7, false);
      world.add(new THREE.Mesh(g, barkMat));
    }
    return curve;
  }

  /* 主枝 A：左下 → 右上（横贯中带） */
  var A = branch([
    [-8.4, -2.6, -2.0], [-5.6, -0.9, -1.2], [-3.0, 0.15, -0.5],
    [-0.2, 1.05, 0.1], [3.0, 1.75, 0.6], [6.2, 2.25, 1.0], [8.8, 2.6, 1.4]
  ], 0.085, 0.022, 5);
  /* 主枝 B：右上 → 中（垂枝） */
  var B = branch([
    [7.6, 3.6, -2.6], [6.2, 2.3, -1.7], [4.9, 0.9, -0.9],
    [3.9, -0.6, -0.2], [3.3, -2.2, 0.4], [3.0, -3.8, 0.9]
  ], 0.07, 0.02, 4);
  /* 小枝三根 */
  branch([[-3.4, 0.0, -0.4], [-3.8, 1.2, -0.2], [-4.5, 2.4, 0.1], [-5.4, 3.4, 0.3]], 0.04, 0.014, 3);
  branch([[0.6, 1.2, 0.1], [0.9, 2.5, 0.0], [1.5, 3.7, -0.2], [2.4, 4.6, -0.3]], 0.042, 0.015, 3);
  branch([[5.2, 1.95, 0.8], [5.4, 3.1, 0.7], [5.3, 4.3, 0.5], [4.9, 5.4, 0.3]], 0.045, 0.016, 3);

  /* ---------- 花簇（沿枝随机采样 → 密集花瓣点云） ---------- */
  var clusterPts = [], clusterCols = [], clusterSizes = [];
  var CL = new THREE.Color();
  function blossoms(curve, count, spread, sizeBase){
    for (var i = 0; i < count; i++){
      var t = Math.pow(Math.random(), 1.25);
      var p = curve.getPoint(t);
      var cx = (Math.random() - 0.5) * spread;
      var cy = (Math.random() - 0.5) * spread;
      var cz = (Math.random() - 0.5) * spread * 0.7;
      var petals = 7 + ((Math.random() * 9) | 0);
      for (var k = 0; k < petals; k++){
        clusterPts.push(
          p.x + cx + (Math.random() - 0.5) * 0.24,
          p.y + cy + (Math.random() - 0.5) * 0.24,
          p.z + cz + (Math.random() - 0.5) * 0.18
        );
        var tone = Math.random();
        CL.setRGB(1, 0.86 + tone * 0.09, 0.90 + tone * 0.06);
        if (tone < 0.22) CL.setRGB(1, 0.78, 0.85);           /* 深一点的蕊侧 */
        if (tone > 0.9) CL.setRGB(1, 0.95, 0.97);            /* 高光瓣 */
        clusterCols.push(CL.r, CL.g, CL.b);
        clusterSizes.push(sizeBase * (0.7 + Math.random() * 0.9));
      }
    }
  }
  blossoms(A, 58, 0.85, 0.40);
  blossoms(B, 44, 0.8, 0.38);
  blossoms(new THREE.CatmullRomCurve3([
    new THREE.Vector3(-3.4, 0.0, -0.4), new THREE.Vector3(-4.5, 2.4, 0.1), new THREE.Vector3(-5.4, 3.4, 0.3)
  ]), 20, 0.66, 0.36);
  blossoms(new THREE.CatmullRomCurve3([
    new THREE.Vector3(0.6, 1.2, 0.1), new THREE.Vector3(1.5, 3.7, -0.2), new THREE.Vector3(2.4, 4.6, -0.3)
  ]), 20, 0.66, 0.36);
  blossoms(new THREE.CatmullRomCurve3([
    new THREE.Vector3(5.2, 1.95, 0.8), new THREE.Vector3(5.3, 4.3, 0.5), new THREE.Vector3(4.9, 5.4, 0.3)
  ]), 20, 0.66, 0.36);

  var clusterGeo = new THREE.BufferGeometry();
  clusterGeo.setAttribute('position', new THREE.Float32BufferAttribute(clusterPts, 3));
  clusterGeo.setAttribute('color', new THREE.Float32BufferAttribute(clusterCols, 3));
  clusterGeo.setAttribute('psize', new THREE.Float32BufferAttribute(clusterSizes, 1));
  var clusterMat = new THREE.ShaderMaterial({
    uniforms: { map: { value: PETAL }, pr: { value: renderer.getPixelRatio() } },
    vertexShader: [
      'attribute float psize; attribute vec3 color; varying vec3 vc; varying float vf;',
      'void main(){ vc = color;',
      '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
      '  vf = clamp(1.15 - (-mv.z - 5.5) * 0.12, 0.3, 1.0);',
      '  gl_PointSize = psize * 330.0 / -mv.z;',
      '  gl_Position = projectionMatrix * mv; }'
    ].join('\n'),
    fragmentShader: [
      'uniform sampler2D map; varying vec3 vc; varying float vf;',
      'void main(){ vec4 t = texture2D(map, gl_PointCoord);',
      '  gl_FragColor = vec4(vc * t.rgb, t.a * vf * 0.96);',
      '  if (gl_FragColor.a < 0.02) discard; }'
    ].join('\n'),
    transparent: true, depthWrite: false
  });
  world.add(new THREE.Points(clusterGeo, clusterMat));

  /* ---------- 花瓣雨（循环粒子） ---------- */
  var N = 1100;
  var fp = new Float32Array(N * 3), fv = new Float32Array(N * 2), fs = new Float32Array(N), fph = new Float32Array(N), fc = new Float32Array(N * 3);
  for (var i = 0; i < N; i++){
    fp[i * 3] = (Math.random() - 0.5) * 20;
    fp[i * 3 + 1] = (Math.random() - 0.5) * 14;
    fp[i * 3 + 2] = (Math.random() - 0.5) * 7 - 0.5;
    fv[i * 2] = 0.4 + Math.random() * 0.75;          /* fall speed */
    fv[i * 2 + 1] = 0.5 + Math.random() * 1.4;       /* sway speed */
    fs[i] = 0.22 + Math.random() * 0.38;
    fph[i] = Math.random() * Math.PI * 2;
    var tone = Math.random();
    CL.setRGB(1, 0.84 + tone * 0.1, 0.9);
    fc[i * 3] = CL.r; fc[i * 3 + 1] = CL.g; fc[i * 3 + 2] = CL.b;
  }
  var fGeo = new THREE.BufferGeometry();
  fGeo.setAttribute('position', new THREE.BufferAttribute(fp, 3));
  fGeo.setAttribute('psize', new THREE.BufferAttribute(fs, 1));
  fGeo.setAttribute('color', new THREE.BufferAttribute(fc, 3));
  var fMat = clusterMat.clone();
  var petals = new THREE.Points(fGeo, fMat);
  world.add(petals);

  /* ---------- 萤光 ---------- */
  var FN = 64;
  var gp = new Float32Array(FN * 3), gs = new Float32Array(FN), gph = new Float32Array(FN);
  for (var j = 0; j < FN; j++){
    gp[j * 3] = (Math.random() - 0.5) * 17;
    gp[j * 3 + 1] = (Math.random() - 0.44) * 12;
    gp[j * 3 + 2] = (Math.random() - 0.5) * 4 + 0.6;
    gs[j] = 0.10 + Math.random() * 0.22;
    gph[j] = Math.random() * 6.28;
  }
  var gGeo = new THREE.BufferGeometry();
  gGeo.setAttribute('position', new THREE.BufferAttribute(gp, 3));
  gGeo.setAttribute('psize', new THREE.BufferAttribute(gs, 1));
  var gMat = new THREE.ShaderMaterial({
    uniforms: { map: { value: GLOW }, t: { value: 0 } },
    vertexShader: [
      'attribute float psize; varying float vf; uniform float t;',
      'void main(){',
      '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
      '  float tw = 0.55 + 0.45 * sin(t * 1.7 + position.x * 5.1);',
      '  vf = tw; gl_PointSize = psize * 110.0 / -mv.z;',
      '  gl_Position = projectionMatrix * mv; }'
    ].join('\n'),
    fragmentShader: [
      'uniform sampler2D map; varying float vf;',
      'void main(){ vec4 t = texture2D(map, gl_PointCoord);',
      '  gl_FragColor = vec4(t.rgb, t.a * vf * 0.5); }'
    ].join('\n'),
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
  world.add(new THREE.Points(gGeo, gMat));

  /* ---------- 月晕 ---------- */
  var moon = new THREE.Sprite(new THREE.SpriteMaterial({
    map: MOON, transparent: true, opacity: 0.36, blending: THREE.AdditiveBlending, depthWrite: false
  }));
  moon.scale.set(14, 14, 1);
  moon.position.set(-5.6, 4.2, -6);
  world.add(moon);

  /* ---------- 鼠标视差 ---------- */
  var mx = 0, my = 0, tx = 0, ty = 0;
  addEventListener('pointermove', function(e){
    tx = (e.clientX / innerWidth - 0.5) * 2;
    ty = (e.clientY / innerHeight - 0.5) * 2;
  });

  /* ---------- 循环 ---------- */
  var RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = performance.now();
  function frame(now){
    var t = (now - t0) / 1000;
    /* 花瓣雨 */
    var pos = fGeo.attributes.position.array;
    for (var i = 0; i < N; i++){
      var ix = i * 3;
      pos[ix] += Math.sin(t * fv[i * 2 + 1] + fph[i]) * 0.004;
      pos[ix + 1] -= fv[i * 2] * 0.011;
      pos[ix + 2] += Math.cos(t * 0.6 + fph[i]) * 0.0022;
      if (pos[ix + 1] < -7.6){
        pos[ix] = (Math.random() - 0.5) * 20;
        pos[ix + 1] = 7.2 + Math.random() * 2.4;
        pos[ix + 2] = (Math.random() - 0.5) * 7 - 0.5;
      }
    }
    fGeo.attributes.position.needsUpdate = true;
    /* 视差 */
    mx += (tx - mx) * 0.045; my += (ty - my) * 0.045;
    camera.position.x = mx * 0.7;
    camera.position.y = -my * 0.42;
    camera.lookAt(-mx * 0.25, my * 0.18, 0);
    world.rotation.y = mx * 0.016;
    world.rotation.x = -my * 0.012;
    gMat.uniforms.t.value = t;
    renderer.render(scene, camera);
    if (!RM) requestAnimationFrame(frame);
  }
  addEventListener('resize', function(){
    W = innerWidth; H = innerHeight;
    camera.aspect = W / H; camera.updateProjectionMatrix();
    renderer.setSize(W, H);
  });
  requestAnimationFrame(frame);
  window.__sceneReady = true;
})();
</script>
</body>
</html>
